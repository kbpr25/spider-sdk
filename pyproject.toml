[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-sdk"
version = "1.0.0"
description = "S.P.I.D.E.R. - Speculative Planning with Iterative Deep Exploration & Refinement"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "S.P.I.D.E.R. Team"}
]
keywords = ["ai", "llm", "swe-bench", "agentic", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.28.0",
    "docker>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
all = [
    "google-generativeai>=0.3.0",
]

[project.scripts]
spider = "spider.cli:main"
spider-solve = "spider.benchmarks.swe_runner:main"

[project.urls]
Homepage = "https://github.com/spider-sdk/spider"
Documentation = "https://spider-sdk.dev/docs"
Repository = "https://github.com/spider-sdk/spider"

[tool.setuptools.packages.find]
where = ["."]
include = ["spider*"]
